<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Strap top -->
  <rect x="11" y="1" width="10" height="8" rx="2.5" fill="#4A7FA5"/>
  <!-- Strap buckle notches -->
  <rect x="13" y="3" width="2" height="1" rx="0.5" fill="#3A6A8A"/>
  <rect x="13" y="5" width="2" height="1" rx="0.5" fill="#3A6A8A"/>
  <!-- Strap bottom -->
  <rect x="11" y="23" width="10" height="8" rx="2.5" fill="#4A7FA5"/>
  <rect x="13" y="25" width="2" height="1" rx="0.5" fill="#3A6A8A"/>
  <rect x="13" y="27" width="2" height="1" rx="0.5" fill="#3A6A8A"/>
  <!-- Watch case -->
  <rect x="5" y="8" width="22" height="16" rx="5" fill="#6AAFD6"/>
  <!-- Case highlight -->
  <rect x="6" y="9" width="20" height="5" rx="3" fill="#85C3E3" opacity="0.4"/>
  <!-- Crown -->
  <rect x="27" y="14" width="3" height="4" rx="1.5" fill="#5A9EC5"/>
  <!-- Watch face -->
  <circle cx="16" cy="16" r="7.5" fill="#EBF7FC"/>
  <!-- Face ring -->
  <circle cx="16" cy="16" r="7.5" fill="none" stroke="#B0D9EE" stroke-width="0.75"/>
  <!-- Hour marks -->
  <line x1="16" y1="9.5" x2="16" y2="11" stroke="#5A9EC5" stroke-width="1" stroke-linecap="round"/>
  <line x1="16" y1="21" x2="16" y2="22.5" stroke="#5A9EC5" stroke-width="1" stroke-linecap="round"/>
  <line x1="9.5" y1="16" x2="11" y2="16" stroke="#5A9EC5" stroke-width="1" stroke-linecap="round"/>
  <line x1="21" y1="16" x2="22.5" y2="16" stroke="#5A9EC5" stroke-width="1" stroke-linecap="round"/>
  <!-- Hour hand -->
  <line x1="16" y1="16" x2="16" y2="12" stroke="#2C4A5A" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="16" y1="16" x2="19.5" y2="17.5" stroke="#2C4A5A" stroke-width="1" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="1.2" fill="#3A6A8A"/>
</svg>
